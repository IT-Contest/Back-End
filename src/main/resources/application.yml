spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000

  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      js-key: ${KAKAO_JS_KEY}
      redirect-uri: http://localhost:8080/login/oauth/kakao
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me

  jwt:
    secret: ${JWT_SECRET}

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    ssuchaehwa.it_project.global.config.security.jwt: warn

openai:
  api:
    key: ${OPENAI_API_KEY}
    url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${OPENAI_MODEL:gpt-4}

server:
  address: 0.0.0.0   # 모든 IP에서 접근 허용
  port: 8080         # 현재 쓰고 있는 포트 유지
